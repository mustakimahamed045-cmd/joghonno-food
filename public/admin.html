<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOGHONNO FOOD — Admin</title>
<link rel="icon" href="/favicon.ico"><link rel="icon" type="image/png" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f7f7f7;font-family:'Hind Siliguri',sans-serif}header{background:#ffd400;color:#111;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:3}h1{font-size:21px;margin:0}.wrap{max-width:1180px;margin:20px auto;padding:0 12px}.panel,.order,.item{background:#1d1d1d;border:1px solid #383838;border-radius:13px;padding:15px;margin-bottom:13px}input,select,textarea,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #555}input,select,textarea{background:#292929;color:white;width:100%;margin:4px 0 10px}textarea{min-height:75px;resize:vertical}button{background:#ffd400;color:#111;border:0;font-weight:700;cursor:pointer}button.secondary{background:#333;color:#fff;border:1px solid #555}button.danger{background:#8d2626;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.muted{color:#bbb}.status{color:#ffdc44;margin:8px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0 14px}.tabs button{white-space:nowrap}.tabs button.active{background:#fff}.hidden{display:none!important}.order h3,.item h3{margin:0}.order p{margin:7px 0}.order select{width:auto;min-width:150px}.address{white-space:pre-wrap;overflow-wrap:anywhere;background:#292929;padding:10px;border-radius:8px;margin:7px 0}.tag{color:#ffd400}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;flex-direction:column;gap:6px}.item small{color:#bbb}.notice{padding:10px;background:#292929;border-radius:8px;margin:10px 0}.thumb{max-width:90px;max-height:70px;object-fit:cover;border-radius:8px}
</style></head><body><header><h1>JOGHONNO FOOD | Admin</h1><button id="logout" class="hidden secondary" onclick="doLogout()">লগআউট</button></header><main class="wrap">
<section id="login" class="panel" style="max-width:430px;margin:40px auto"><h2>অ্যাডমিন লগইন</h2><label>Username</label><input id="username" autocomplete="username" value="joghonno_admin"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="doLogin()">লগইন</button><div id="loginMsg" class="status"></div></section>
<section id="dashboard" class="hidden"><div class="tabs"><button class="active" data-tab="orders" onclick="tab('orders',this)">অর্ডার</button><button data-tab="foods" onclick="tab('foods',this)">খাবার ম্যানেজমেন্ট</button><button data-tab="categories" onclick="tab('categories',this)">ক্যাটাগরি</button><button data-tab="areas" onclick="tab('areas',this)">ডেলিভারি এলাকা</button><button data-tab="settings" onclick="tab('settings',this)">ওয়েবসাইট সেটিংস</button></div>
<section id="pane-orders"><div class="row"><div><h2>অর্ডার ম্যানেজমেন্ট</h2><p class="muted">সর্বশেষ অর্ডার আগে দেখানো হবে</p></div><button onclick="loadOrders()">রিফ্রেশ</button></div><div id="orders"></div></section>
<section id="pane-foods" class="hidden"><div class="row"><h2>খাবার ম্যানেজমেন্ট</h2><button onclick="newFood()">+ নতুন খাবার</button></div><div id="foodForm" class="panel hidden"></div><div id="foods" class="grid"></div></section>
<section id="pane-categories" class="hidden"><div class="row"><h2>ক্যাটাগরি ম্যানেজমেন্ট</h2><button onclick="newCategory()">+ নতুন ক্যাটাগরি</button></div><div id="catForm" class="panel hidden"></div><div id="categories" class="grid"></div></section>
<section id="pane-areas" class="hidden"><div class="row"><h2>ডেলিভারি এলাকা ও চার্জ</h2><button onclick="newArea()">+ নতুন এলাকা</button></div><div id="areaForm" class="panel hidden"></div><div id="areas" class="grid"></div></section>
<section id="pane-settings" class="hidden"><h2>ওয়েবসাইট ও ব্যবসার সেটিংস</h2><div id="settings" class="panel"></div></section>
</section></main><script>
const API="/api";let token="",catalog={categories:[],foods:[],areas:[],settings:{}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"৳"+Number(n||0).toLocaleString("en-US");
async function req(path,opt={}){const r=await fetch(API+path,{cache:"no-store",...opt});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||"অনুরোধটি সম্পন্ন হয়নি");return j}
const auth=()=>({Authorization:"Bearer "+token});
async function doLogin(){const btn=document.querySelector("#login button");btn.disabled=true;try{let j=await req("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value.trim(),password:password.value})});token=j.token;login.classList.add("hidden");dashboard.classList.remove("hidden");logout.classList.remove("hidden");await Promise.all([loadOrders(),loadCatalog()]);}catch(e){loginMsg.textContent=e.message}finally{btn.disabled=false}}
function doLogout(){token="";dashboard.classList.add("hidden");login.classList.remove("hidden");logout.classList.add("hidden")}
function tab(name,btn){document.querySelectorAll("[id^=pane-]").forEach(x=>x.classList.add("hidden"));document.getElementById("pane-"+name).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}
async function loadOrders(){orders.innerHTML='<p class="muted">লোড হচ্ছে...</p>';try{let j=await req("/admin/orders",{headers:auth()});orders.innerHTML=j.orders.length?j.orders.map(o=>{let its=j.items.filter(x=>x.order_id===o.id);return '<article class="order"><div class="row"><h3>'+esc(o.order_code)+' — '+money(o.total)+'</h3><b>'+esc(o.customer_name)+'</b></div><p>📞 '+esc(o.mobile)+' | এলাকা: '+esc(o.area_name||"")+'</p><b class="tag">সম্পূর্ণ ডেলিভারি ঠিকানা</b><div class="address">'+esc(o.address||"ঠিকানা দেওয়া হয়নি")+'</div><div class="actions"><button class="secondary" onclick="copyTextFrom(this)" data-address="'+esc(o.address||"")+'">ঠিকানা কপি</button></div><p>খাবার: '+(its.map(x=>esc(x.food_name)+" × "+x.quantity).join(", ")||"—")+'</p><p>সাবটোটাল: '+money(o.subtotal)+' | ডেলিভারি: '+money(o.delivery_charge)+' | মোট: '+money(o.total)+'</p><p>পেমেন্ট: '+esc(o.payment_method)+' | '+esc(o.payment_status)+' '+(o.sender_number?'| Sender: '+esc(o.sender_number):"")+' '+(o.transaction_id?'| TrxID: '+esc(o.transaction_id):"")+'</p><p>কাস্টমার নোট: '+esc(o.note||"—")+'</p><div class="grid"><label>অর্ডার স্ট্যাটাস<select id="s-'+o.id+'">'+["Pending","Confirmed","Preparing","Ready","Out for Delivery","Delivered","Cancelled"].map(v=>'<option '+(o.order_status===v?"selected":"")+'>'+v+'</option>').join("")+'</select></label><label>পেমেন্ট স্ট্যাটাস<select id="p-'+o.id+'">'+["Unpaid (COD)","Verification Pending","Paid","Rejected","Refunded"].map(v=>'<option '+(o.payment_status===v?"selected":"")+'>'+v+'</option>').join("")+'</select></label></div><button onclick="saveOrder('+JSON.stringify(o.order_code)+','+o.id+')">আপডেট সংরক্ষণ</button></article>'}).join(""):'<p class="muted">এখনো কোনো অর্ডার নেই।</p>'}catch(e){orders.innerHTML='<p class="status">'+esc(e.message)+'</p>'}}
async function saveOrder(code,id){try{await req("/admin/update",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({orderCode:code,orderStatus:document.getElementById("s-"+id).value,paymentStatus:document.getElementById("p-"+id).value})});alert("আপডেট সংরক্ষণ হয়েছে");loadOrders()}catch(e){alert(e.message)}}
function copyTextFrom(el){copyText(el.dataset.address||"")}\nfunction copyText(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert("কপি হয়েছে")).catch(()=>prompt("ঠিকানা কপি করুন",t));else prompt("ঠিকানা কপি করুন",t)}
async function loadCatalog(){catalog=await req("/admin/catalog",{headers:auth()});renderFoods();renderCats();renderAreas();renderSettings()}
function renderFoods(){foods.innerHTML=catalog.foods.map(f=>'<article class="item">'+(f.image_url?'<img class="thumb" src="'+esc(f.image_url)+'">':"")+'<h3>'+esc(f.name)+'</h3><small>'+esc((catalog.categories.find(c=>c.id===f.category_id)||{}).name||"ক্যাটাগরি নেই")+' · '+money(f.price)+(f.offer_price!==null?" · অফার "+money(f.offer_price):"")+' · ক্রম '+f.sort_order+'</small><small>'+esc(f.description)+' · '+(f.available?"Available":"Unavailable")+'</small><div class="actions"><button onclick="editFood('+f.id+')">সম্পাদনা</button><button class="secondary" onclick="moveFood('+f.id+',-1)">↑ উপরে</button><button class="secondary" onclick="moveFood('+f.id+',1)">↓ নিচে</button><button class="danger" onclick="removeFood('+f.id+')">সরান</button></div></article>').join("")||"কোনো খাবার নেই"}
function newFood(){showFood({id:0,category_id:catalog.categories[0]?.id||"",name:"",description:"",price:0,offer_price:"",image_url:"",available:1,sort_order:catalog.foods.length+1})}
function editFood(id){showFood(catalog.foods.find(x=>x.id===id))}
function showFood(f){foodForm.classList.remove("hidden");foodForm.innerHTML='<h3>'+(f.id?"খাবার সম্পাদনা":"নতুন খাবার যোগ")+'</h3><form id="foodEditor" class="grid"><input type="hidden" name="id" value="'+f.id+'"><label>খাবারের নাম<input name="name" required value="'+esc(f.name)+'"></label><label>ক্যাটাগরি<select name="category_id">'+catalog.categories.filter(c=>c.active).map(c=>'<option value="'+c.id+'" '+(c.id===f.category_id?"selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select></label><label>মূল দাম<input name="price" type="number" min="0" required value="'+f.price+'"></label><label>অফার দাম (না থাকলে ফাঁকা)<input name="offer_price" type="number" min="0" value="'+(f.offer_price??"")+'"></label><label>সাজানোর ক্রম<input name="sort_order" type="number" value="'+f.sort_order+'"></label><label>ছবির URL<input name="image_url" type="url" placeholder="https://..." value="'+esc(f.image_url)+'"></label><label>বর্ণনা<textarea name="description">'+esc(f.description)+'</textarea></label><label>অবস্থা<select name="available"><option value="1" '+(f.available?"selected":"")+'>Available</option><option value="0" '+(!f.available?"selected":"")+'>Unavailable</option></select></label><div class="actions"><button>সংরক্ষণ</button><button type="button" class="secondary" onclick="foodForm.classList.add(\'hidden\')">বাতিল</button></div></form>';foodEditor.onsubmit=saveFood}
async function saveFood(ev){ev.preventDefault();const b=Object.fromEntries(new FormData(foodEditor));try{await req("/admin/food",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(b)});foodForm.classList.add("hidden");await loadCatalog();alert("খাবারের তথ্য সংরক্ষণ হয়েছে")}catch(e){alert(e.message)}}
async function moveFood(id,delta){let list=[...catalog.foods].sort((a,b)=>a.sort_order-b.sort_order),i=list.findIndex(x=>x.id===id),j=i+delta;if(j<0||j>=list.length)return;let a=list[i],b=list[j];await Promise.all([saveFoodOrder(a,b.sort_order),saveFoodOrder(b,a.sort_order)]);await loadCatalog()}
async function saveFoodOrder(f,n){await req("/admin/food",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({...f,sort_order:n})})}
async function removeFood(id){if(!confirm("এই খাবারটি ওয়েবসাইট থেকে সরাবেন? পরে Available করে ফিরিয়ে আনা যাবে।"))return;await req("/admin/food",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({action:"delete",id})});loadCatalog()}
function renderCats(){categories.innerHTML=catalog.categories.map(c=>'<article class="item"><h3>'+esc(c.name)+'</h3><small>ক্রম '+c.sort_order+' · '+(c.active?"সক্রিয়":"নিষ্ক্রিয়")+'</small><div class="actions"><button onclick="editCategory('+c.id+')">সম্পাদনা</button><button class="secondary" onclick="moveCategory('+c.id+',-1)">↑</button><button class="secondary" onclick="moveCategory('+c.id+',1)">↓</button><button class="danger" onclick="removeCategory('+c.id+')">নিষ্ক্রিয়</button></div></article>').join("")}
function newCategory(){showCategory({id:0,name:"",sort_order:catalog.categories.length+1,active:1})}function editCategory(id){showCategory(catalog.categories.find(x=>x.id===id))}
function showCategory(c){catForm.classList.remove("hidden");catForm.innerHTML='<h3>ক্যাটাগরি</h3><form id="catEditor" class="grid"><input type="hidden" name="id" value="'+c.id+'"><label>নাম<input name="name" required value="'+esc(c.name)+'"></label><label>ক্রম<input name="sort_order" type="number" value="'+c.sort_order+'"></label><label>অবস্থা<select name="active"><option value="1" '+(c.active?"selected":"")+'>সক্রিয়</option><option value="0" '+(!c.active?"selected":"")+'>নিষ্ক্রিয়</option></select></label><div class="actions"><button>সংরক্ষণ</button><button type="button" class="secondary" onclick="catForm.classList.add(\'hidden\')">বাতিল</button></div></form>';catEditor.onsubmit=async ev=>{ev.preventDefault();try{await req("/admin/category",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(catEditor)))});catForm.classList.add("hidden");await loadCatalog()}catch(e){alert(e.message)}}}
async function moveCategory(id,d){let a=[...catalog.categories].sort((x,y)=>x.sort_order-y.sort_order),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;let x=a[i],y=a[j];await Promise.all([catSave({...x,sort_order:y.sort_order}),catSave({...y,sort_order:x.sort_order})]);loadCatalog()}function catSave(b){return req("/admin/category",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(b)})}
async function removeCategory(id){if(!confirm("ক্যাটাগরিটি নিষ্ক্রিয় করবেন?"))return;await req("/admin/category",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({action:"delete",id})});loadCatalog()}
function renderAreas(){areas.innerHTML=catalog.areas.map(a=>'<article class="item"><h3>'+esc(a.name)+'</h3><small>ডেলিভারি চার্জ '+money(a.charge)+' · '+(a.active?"সক্রিয়":"নিষ্ক্রিয়")+'</small><button onclick="editArea('+a.id+')">সম্পাদনা</button></article>').join("")}
function newArea(){showArea({id:0,name:"",charge:0,sort_order:catalog.areas.length+1,active:1})}function editArea(id){showArea(catalog.areas.find(x=>x.id===id))}
function showArea(a){areaForm.classList.remove("hidden");areaForm.innerHTML='<h3>ডেলিভারি এলাকা</h3><form id="areaEditor" class="grid"><input type="hidden" name="id" value="'+a.id+'"><label>এলাকার নাম<input name="name" required value="'+esc(a.name)+'"></label><label>চার্জ (টাকা)<input name="charge" type="number" min="0" required value="'+a.charge+'"></label><label>ক্রম<input name="sort_order" type="number" value="'+a.sort_order+'"></label><label>অবস্থা<select name="active"><option value="1" '+(a.active?"selected":"")+'>সক্রিয়</option><option value="0" '+(!a.active?"selected":"")+'>নিষ্ক্রিয়</option></select></label><div class="actions"><button>সংরক্ষণ</button><button type="button" class="secondary" onclick="areaForm.classList.add(\'hidden\')">বাতিল</button>'+(a.id?'<button type="button" class="danger" onclick="removeArea('+a.id+')">নিষ্ক্রিয়</button>':"")+'</div></form>';areaEditor.onsubmit=async ev=>{ev.preventDefault();try{await req("/admin/area",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(areaEditor)))});areaForm.classList.add("hidden");loadCatalog()}catch(e){alert(e.message)}}}
async function removeArea(id){if(!confirm("এলাকাটি নিষ্ক্রিয় করবেন?"))return;await req("/admin/area",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({action:"delete",id})});loadCatalog()}
function renderSettings(){const s=catalog.settings;const fields=[["business_name","ব্যবসার নাম"],["restaurant_name","রেস্টুরেন্টের নাম"],["tagline","ট্যাগলাইন"],["hero_title","হোমপেজের বড় শিরোনাম"],["hero_subtitle","হোমপেজের সাব-শিরোনাম"],["website_notice","ওয়েবসাইটের নোটিশ / নোটিশ ব্যানার"],["logo_url","লোগোর ছবির URL"],["banner_image_url","হোমপেজ ব্যানার ছবির URL"],["brand_primary_color","প্রধান ব্র্যান্ড কালার (HEX)"],["brand_secondary_color","দ্বিতীয় ব্র্যান্ড কালার (HEX)"],["footer_text","ফুটারের লেখা"],["opening_hours","খোলার সময় (বাংলায়)"],["business_hours","সময় (যেমন 11:00-20:00)"],["support_phone","যোগাযোগ নম্বর"],["bkash_number","বিকাশ নম্বর"],["nagad_number","নগদ নম্বর"],["min_order_amount","সর্বনিম্ন অর্ডার"],["currency","মুদ্রা চিহ্ন"],["is_store_open","দোকান খোলা?"]];settings.innerHTML='<form id="settingsEditor" class="grid">'+fields.map(([k,l])=>'<label>'+l+(k==="website_notice"?'<textarea name="'+k+'">'+esc(s[k]||"")+'</textarea>':k==="is_store_open"?'<select name="'+k+'"><option value="true" '+(s[k]!=="false"?"selected":"")+'>খোলা</option><option value="false" '+(s[k]==="false"?"selected":"")+'>বন্ধ</option></select>':'<input name="'+k+'" value="'+esc(s[k]||"")+'">')+'</label>').join("")+'<div class="notice">এখানকার পরিবর্তন সংরক্ষণ করলে ওয়েবসাইটের সেটিংসে প্রভাব পড়বে। লোগো/ব্যানারের ছবি আপলোডের সুবিধা পরের ধাপে যুক্ত করা যাবে; আপাতত খাবারের ছবির URL দেওয়া যাবে।</div><button>সব সেটিংস সংরক্ষণ</button></form>';settingsEditor.onsubmit=async ev=>{ev.preventDefault();try{await req("/admin/settings",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({settings:Object.fromEntries(new FormData(settingsEditor))})});await loadCatalog();alert("সেটিংস সংরক্ষণ হয়েছে")}catch(e){alert(e.message)}}}
</script></body></html>
