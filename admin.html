<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9e1b1b">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Admin Panel | JOGHONNO FOOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#9e1b1b;--red2:#7d1515;--orange:#f4a261;--bg:#f7f5f2;--surface:#fff;--ink:#242424;--muted:#777;--line:#ece7e2;--green:#16834a;--shadow:0 8px 28px #35100d0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(140deg,#5f1010,#9e1b1b 55%,#d66a38)}.login-card{width:min(100%,420px);background:white;border-radius:22px;padding:30px;box-shadow:0 25px 70px #25070755}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{width:48px;height:48px;border-radius:15px;background:var(--red);color:white;display:grid;place-items:center;font-size:24px;font-weight:700}.brand h1{font-size:22px;margin:0;color:var(--red)}.brand p{margin:0;color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}.field label{font-weight:600;font-size:14px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;color:var(--ink);min-width:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #9e1b1b12}.field textarea{min-height:76px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red2)}.btn-light{background:#f4efeb;color:#4a302c}.btn-danger{background:#fff0ef;color:#b42318}.btn-success{background:#eaf7ef;color:#147a42}.btn:disabled{opacity:.55;cursor:not-allowed}.login-card .btn{width:100%;padding:12px}.hint{font-size:12px;color:var(--muted);margin-top:13px}.error{color:#b42318;background:#fff0ef;padding:9px 11px;border-radius:9px;margin:10px 0;font-size:13px}.app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.top-left{display:flex;align-items:center;gap:12px}.top-left .brand-mark{width:40px;height:40px;border-radius:12px;font-size:20px}.top-left h1{font-size:18px;margin:0;color:var(--red)}.top-left small{display:block;color:var(--muted);font-size:11px}.top-actions{display:flex;align-items:center;gap:10px}.admin-name{font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{padding:22px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 68px)}.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:10px;color:#594e49;font-weight:600;margin:3px 0;display:flex;gap:10px;align-items:center}.nav-btn.active,.nav-btn:hover{background:#f8eae7;color:var(--red)}.nav-icon{width:22px;text-align:center}.main{padding:26px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.page-head h2{font-size:24px;margin:0}.page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:17px}.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:27px;font-weight:700;margin-top:2px}.stat .emoji{float:right;font-size:22px}.panel{padding:18px;margin-bottom:17px}.panel h3{font-size:17px;margin:0 0 14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input{max-width:270px}.table-wrap{overflow:auto;width:100%}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{background:#faf8f6;color:#655b55;font-weight:700;white-space:nowrap}td .sub{display:block;color:var(--muted);font-size:11px}.pill{display:inline-block;padding:3px 9px;border-radius:30px;background:#f4efeb;font-size:11px;font-weight:600}.pill.green{background:#eaf7ef;color:#147a42}.pill.red{background:#fff0ef;color:#b42318}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{padding:6px 9px;font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.check-row{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 14px}.check-row label{display:flex;align-items:center;gap:6px;font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#160b0bcc;z-index:20;display:grid;place-items:center;padding:15px}.modal{width:min(100%,650px);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:20px;box-shadow:0 20px 60px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0;font-size:19px}.close{border:0;background:#f3efec;border-radius:9px;width:34px;height:34px;font-size:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;right:20px;z-index:40;background:#25201e;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);max-width:min(90vw,400px)}.notice{background:#fff8e9;border:1px solid #f4dfb5;color:#79551b;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:15px}.thumb{width:45px;height:40px;object-fit:cover;border-radius:7px;background:#eee}.setting-row{display:grid;grid-template-columns:minmax(130px,1fr) minmax(180px,2fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.setting-row label{font-weight:600;font-size:13px}.setting-row small{display:block;color:var(--muted);font-weight:400}.setting-row input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.loading{opacity:.65;pointer-events:none}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;min-height:0;padding:9px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}.nav-btn{white-space:nowrap;width:auto;margin:0;padding:9px 12px}.main{padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.topbar{padding:0 13px;height:60px}.top-left h1{font-size:15px}.top-left .brand-mark{width:36px;height:36px}.admin-name{display:none}.main{padding:14px 11px}.page-head h2{font-size:21px}.stats{gap:9px}.stat{padding:12px}.stat .value{font-size:23px}.panel{padding:13px}.grid2{grid-template-columns:1fr}.setting-row{grid-template-columns:1fr;gap:5px}.top-actions .btn{padding:8px 10px;font-size:12px}.login-card{padding:23px}}
</style>
</head>
<body>
<section id="loginView" class="login-wrap"><div class="login-card"><div class="brand"><div class="brand-mark">J</div><div><h1>JOGHONNO FOOD</h1><p>নিরাপদ অ্যাডমিন প্যানেল</p></div></div><h2 style="font-size:21px;margin:0 0 5px">Admin Login</h2><p style="color:#777;margin:0 0 18px;font-size:13px">তোমার Admin password দিয়ে প্রবেশ করো।</p><form id="loginForm"><div class="field"><label for="adminName">Admin নাম (ঐচ্ছিক)</label><input id="adminName" autocomplete="username" placeholder="যেমন: Admin"></div><div class="field"><label for="adminPassword">Admin Password</label><input id="adminPassword" type="password" required autocomplete="current-password" placeholder="তোমার পাসওয়ার্ড"></div><div id="loginError" class="error hidden"></div><button id="loginBtn" class="btn btn-primary" type="submit">লগইন করো</button></form><div class="hint">পাসওয়ার্ড এই ডিভাইসে সংরক্ষণ করা হয় না।</div></div></section>
<div id="appView" class="app hidden"><header class="topbar"><div class="top-left"><div class="brand-mark">J</div><div><h1>JOGHONNO FOOD</h1><small>ADMIN CONTROL CENTER</small></div></div><div class="top-actions"><span id="adminLabel" class="admin-name"></span><button class="btn btn-light" id="refreshBtn">↻ রিফ্রেশ</button><button class="btn btn-danger" id="logoutBtn">লগআউট</button></div></header><div class="layout"><nav class="sidebar" id="nav"><button class="nav-btn active" data-page="dashboard"><span class="nav-icon">▦</span>ড্যাশবোর্ড</button><button class="nav-btn" data-page="orders"><span class="nav-icon">▤</span>অর্ডার</button><button class="nav-btn" data-page="foods"><span class="nav-icon">🍔</span>খাবার</button><button class="nav-btn" data-page="categories"><span class="nav-icon">▦</span>ক্যাটাগরি</button><button class="nav-btn" data-page="customers"><span class="nav-icon">♙</span>কাস্টমার</button><button class="nav-btn" data-page="payments"><span class="nav-icon">৳</span>পেমেন্ট</button><button class="nav-btn" data-page="settings"><span class="nav-icon">⚙</span>সেটিংস</button><button class="nav-btn" data-page="logs"><span class="nav-icon">☷</span>Admin Logs</button><button class="nav-btn" data-page="password"><span class="nav-icon">🔒</span>পাসওয়ার্ড পরিবর্তন</button></nav><main class="main" id="mainContent"><div class="empty">ডেটা লোড হচ্ছে...</div></main></div></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbwfdpjiKSBNP0TLBbJBE1didWNGTsVWfPT4U7S5eWwIwHeDwUT3bkLLdMgUbTGeyir1-A/exec';
const $=s=>document.querySelector(s);let state={token:sessionStorage.getItem('jfood_admin_token')||'',adminName:sessionStorage.getItem('jfood_admin_name')||'',data:null,page:'dashboard',foodSearch:'',orderSearch:'',busy:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'৳'+(Number(v)||0).toLocaleString('en-BD');
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3200)}
async function post(action,extra={}){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:state.token,...extra})});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error('সার্ভার থেকে JSON উত্তর পাওয়া যায়নি। Apps Script Web App deployment পরীক্ষা করো।')}if(!r.ok||j.success===false)throw new Error(j.message||j.error||'অনুরোধটি সম্পন্ন হয়নি।');return j}
function showLogin(msg=''){state.token='';sessionStorage.removeItem('jfood_admin_token');sessionStorage.removeItem('jfood_admin_name');$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#loginError').textContent=msg;$('#loginError').classList.toggle('hidden',!msg)}
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#adminLabel').textContent=state.adminName?`স্বাগতম, ${state.adminName}`:'Admin'; }
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#loginBtn');btn.disabled=true;btn.textContent='লগইন হচ্ছে...';$('#loginError').classList.add('hidden');try{const j=await post('adminLogin',{password:$('#adminPassword').value,adminName:$('#adminName').value.trim()});if(!j.token)throw new Error('Login সফল হলেও session token পাওয়া যায়নি।');state.token=j.token;state.adminName=j.adminName||$('#adminName').value.trim()||'Admin';sessionStorage.setItem('jfood_admin_token',state.token);sessionStorage.setItem('jfood_admin_name',state.adminName);$('#adminPassword').value='';showApp();await loadData()}catch(err){$('#loginError').textContent=err.message;$('#loginError').classList.remove('hidden')}finally{btn.disabled=false;btn.textContent='লগইন করো'}});
async function loadData(){if(!state.token)return;try{const j=await post('getAdminFullData');state.data=j;render()}catch(err){if(/unauthor|token|session/i.test(err.message)){showLogin('সেশন শেষ হয়েছে। আবার লগইন করো।')}else toast(err.message)}}
function nav(page){state.page=page;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)nav(b.dataset.page)});$('#refreshBtn').onclick=loadData;
$('#logoutBtn').onclick=async()=>{try{await post('adminLogout')}catch(_){}showLogin('')};
function orders(){return Array.isArray(state.data?.orders)?state.data.orders:[]}
function newestOrders(arr){return arr.slice().sort((a,b)=>{const ta=Date.parse(a.CreatedAt||a.UpdatedAt||'')||0,tb=Date.parse(b.CreatedAt||b.UpdatedAt||'')||0;return tb-ta})}function foods(){return Array.isArray(state.data?.foods)?state.data.foods:[]}function cats(){return Array.isArray(state.data?.categories)?state.data.categories:[]}function settings(){const raw=state.data?.settings||{};const a=Array.isArray(raw)?raw:Object.entries(raw).map(([SettingKey,SettingValue])=>({SettingKey,SettingValue,Description:''}));if(!a.some(x=>x.SettingKey==='delivery_areas_json'))a.push({SettingKey:'delivery_areas_json',SettingValue:'[]',Description:'ডেলিভারি এলাকার তালিকা'});return a}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function render(){if(!state.data)return;const root=$('#mainContent');switch(state.page){case'dashboard':root.innerHTML=dashboard();break;case'orders':root.innerHTML=ordersPage();break;case'foods':root.innerHTML=foodsPage();break;case'categories':root.innerHTML=categoriesPage();break;case'customers':root.innerHTML=customersPage();break;case'payments':root.innerHTML=paymentsPage();break;case'settings':root.innerHTML=settingsPage();break;case'logs':root.innerHTML=logsPage();break;case'password':root.innerHTML=passwordPage();break;}bindPage()}
function dashboard(){const os=orders(),fs=foods().filter(f=>f.ActiveStatus!=='DELETED'),cs=cats().filter(c=>String(c.IsActive)!=='false'),pending=os.filter(o=>String(o.OrderStatus||'').toLowerCase()==='pending').length;const total=os.reduce((s,o)=>s+(Number(o.GrandTotal)||0),0);return pageHead('ড্যাশবোর্ড','তোমার রেস্টুরেন্টের সার্বিক অবস্থা')+`<div class="stats"><div class="stat"><span class="emoji">📦</span><div class="label">মোট অর্ডার</div><div class="value">${os.length}</div></div><div class="stat"><span class="emoji">⏳</span><div class="label">Pending অর্ডার</div><div class="value">${pending}</div></div><div class="stat"><span class="emoji">🍔</span><div class="label">সক্রিয় খাবার</div><div class="value">${fs.length}</div></div><div class="stat"><span class="emoji">৳</span><div class="label">মোট অর্ডার মূল্য</div><div class="value">${money(total)}</div></div></div><div class="panel"><h3>সাম্প্রতিক অর্ডার</h3>${ordersTable(newestOrders(os).slice(0,7),false)}</div><div class="grid2"><div class="panel"><h3>ক্যাটাগরি</h3><div style="font-size:28px;font-weight:700">${cs.length}</div><span class="sub">মোট ক্যাটাগরি</span></div><div class="panel"><h3>কাস্টমার</h3><div style="font-size:28px;font-weight:700">${(state.data.customers||[]).length}</div><span class="sub">মোট নিবন্ধিত কাস্টমার</span></div></div>`}
function ordersPage(){const q=state.orderSearch.toLowerCase();const arr=newestOrders(orders()).filter(o=>[o.OrderID,o.CustomerName,o.Mobile,o.DeliveryAddress,o.OrderStatus].join(' ').toLowerCase().includes(q));return pageHead('অর্ডার ম্যানেজমেন্ট','অর্ডার দেখো এবং স্ট্যাটাস আপডেট করো')+`<div class="panel"><div class="toolbar"><input id="orderSearch" placeholder="Order ID / নাম / মোবাইল খুঁজুন" value="${esc(state.orderSearch)}"><span class="pill">${arr.length}টি অর্ডার</span></div>${ordersTable(arr,true)}</div>`}
function ordersTable(arr,editable){if(!arr.length)return '<div class="empty">কোনো অর্ডার পাওয়া যায়নি।</div>';return `<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Delivery Address</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th>${editable?'<th>Action</th>':''}</tr></thead><tbody>${arr.map(o=>{const items=Array.isArray(o.items)?o.items:[];return `<tr><td><b>${esc(o.OrderID)}</b><span class="sub">${esc(o.CreatedAt||'')}</span></td><td>${esc(o.CustomerName)}<span class="sub">${esc(o.Mobile)}</span></td><td>${esc(o.DeliveryAddress||'—')}</td><td>${items.map(i=>`${esc(i.FoodName)} × ${esc(i.Quantity)}`).join('<br>')||'—'}</td><td><b>${money(o.GrandTotal)}</b></td><td>${(()=>{const p=(state.data.payments||[]).find(x=>String(x.OrderID)===String(o.OrderID))||{};const sender=p.SenderNumber||o.SenderNumber||o.senderNumber||'';const trx=p.TransactionID||o.TransactionID||o.transactionId||'';return `${esc(o.PaymentMethod||p.Method||'—')}<span class="sub">${esc(o.PaymentStatus||p.VerificationStatus||'')}</span>${sender?`<span class="sub">প্রেরকের নম্বর: ${esc(sender)}</span>`:''}${trx?`<span class="sub">Transaction ID: ${esc(trx)}</span>`:''}`})()}</td><td><span class="pill ${String(o.OrderStatus).toLowerCase()==='delivered'?'green':String(o.OrderStatus).toLowerCase()==='cancelled'?'red':''}">${esc(o.OrderStatus||'—')}</span></td>${editable?`<td><button class="btn btn-light" data-order-edit="${esc(o.OrderID)}">আপডেট</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function foodsPage(){const q=state.foodSearch.toLowerCase();const arr=foods().filter(f=>f.ActiveStatus!=='DELETED'&&[f.Name,f.FoodID,f.ShortDesc].join(' ').toLowerCase().includes(q));return pageHead('খাবার ম্যানেজমেন্ট','নতুন খাবার যোগ, সম্পাদনা ও মুছে ফেলো','<button class="btn btn-primary" id="addFood">＋ খাবার যোগ</button>')+`<div class="panel"><div class="toolbar"><input id="foodSearch" placeholder="খাবারের নাম খুঁজুন" value="${esc(state.foodSearch)}"><span class="pill">${arr.length}টি খাবার</span></div><div class="table-wrap"><table><thead><tr><th>ছবি</th><th>খাবার</th><th>দাম</th><th>ক্যাটাগরি</th><th>অবস্থা</th><th>Action</th></tr></thead><tbody>${arr.map(f=>`<tr><td>${f.ImageURL?`<img class="thumb" src="${esc(f.ImageURL)}" alt="" onerror="this.style.display='none'">`:'—'}</td><td><b>${esc(f.Name)}</b><span class="sub">${esc(f.FoodID)}</span></td><td>${money(f.DiscountPrice||f.RegularPrice)}<span class="sub">Regular: ${money(f.RegularPrice)}</span></td><td>${esc(cats().find(c=>String(c.CategoryID)===String(f.CategoryID))?.CategoryName||'—')}</td><td><span class="pill ${String(f.IsAvailable)==='true'?'green':'red'}">${String(f.IsAvailable)==='true'?'Available':'Unavailable'}</span></td><td><div class="actions"><button class="btn btn-light" data-food-edit="${esc(f.FoodID)}">Edit</button><button class="btn btn-danger" data-food-delete="${esc(f.FoodID)}">Delete</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function categoriesPage(){return pageHead('ক্যাটাগরি ম্যানেজমেন্ট','খাবারের ক্যাটাগরি তৈরি ও সম্পাদনা','<button class="btn btn-primary" id="addCategory">＋ ক্যাটাগরি যোগ</button>')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>ক্যাটাগরি</th><th>Sort Order</th><th>অবস্থা</th><th>Action</th></tr></thead><tbody>${cats().map(c=>`<tr><td><b>${esc(c.CategoryName)}</b><span class="sub">${esc(c.CategoryID)}</span></td><td>${esc(c.SortOrder??'—')}</td><td><span class="pill ${String(c.IsActive)==='true'?'green':'red'}">${String(c.IsActive)==='true'?'Active':'Inactive'}</span></td><td><div class="actions"><button class="btn btn-light" data-cat-edit="${esc(c.CategoryID)}">Edit</button><button class="btn btn-danger" data-cat-delete="${esc(c.CategoryID)}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">কোনো ক্যাটাগরি নেই।</td></tr>'}</tbody></table></div></div>`}

function paymentsPage(){const arr=state.data.payments||[];return pageHead('পেমেন্ট রেকর্ড','অনলাইন পেমেন্ট ও ভেরিফিকেশন তথ্য')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Payment ID</th><th>Order ID</th><th>Method</th><th>Sender</th><th>Transaction ID</th><th>Amount</th><th>Status</th></tr></thead><tbody>${arr.slice().reverse().map(p=>`<tr><td>${esc(p.PaymentID)}</td><td>${esc(p.OrderID)}</td><td>${esc(p.Method)}</td><td>${esc(p.SenderNumber)}</td><td>${esc(p.TransactionID)}</td><td>${money(p.Amount)}</td><td><span class="pill">${esc(p.VerificationStatus)}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">পেমেন্ট রেকর্ড নেই।</td></tr>'}</tbody></table></div></div>`}

hero_button_enabled','slogans_json','show_categories_section','show_featured_section','show_popular_section','show_notice_section','show_delivery_info','logo_url','hero_banner_url','hero_mobile_banner_url','favicon_url','footer_text','footer_about','facebook_url','instagram_url','youtube_url'].includes(k)))}<div class="modal-actions"><button class="btn btn-primary" type="submit">সব সেটিংস সংরক্ষণ</button></div></form>`}
function settingsGroup(list,keys){return keys.map(k=>{const s=list.find(x=>x.SettingKey===k);if(!s)return '';return `<div class="setting-row"><label>${esc(k)}<small>${esc(s.Description||'')}</small></label>${k==='delivery_areas_json'?`<div id="deliveryAreaEditor"></div><textarea id="deliveryAreasJson" name="delivery_areas_json" hidden>${esc(s.SettingValue||'[]')}</textarea><button type="button" class="btn btn-light" id="addDeliveryArea">＋ নতুন এলাকা যোগ</button><small>এখান থেকে এলাকার নাম, চার্জ ও চালু/বন্ধ নিয়ন্ত্রণ করতে পারবে।</small>`:`<input name="${esc(k)}" value="${esc(s.SettingValue)}">`}</div>`}).join('')}
function logsPage(){const arr=state.data.logs||[];return pageHead('Admin Logs','অ্যাডমিনের কার্যক্রমের রেকর্ড')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>সময়</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>${arr.slice().reverse().map(l=>`<tr><td>${esc(l.Timestamp)}</td><td>${esc(l.AdminName)}</td><td>${esc(l.ActionType)}</td><td>${esc(l.TargetID)}</td><td>${esc(l.Details)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">কোনো লগ নেই।</td></tr>'}</tbody></table></div></div>`}
function passwordPage(){return pageHead('Admin Password','বর্তমান পাসওয়ার্ড দিয়ে নতুন পাসওয়ার্ড সেট করো')+`<div class="panel" style="max-width:520px"><div class="notice">নতুন পাসওয়ার্ড কমপক্ষে ১২ অক্ষরের হতে হবে। এটি শুধু Apps Script-এর Script Properties-এ Hash হিসেবে সংরক্ষিত হবে।</div><form id="passwordForm"><div class="field"><label>বর্তমান পাসওয়ার্ড</label><input name="currentPassword" type="password" required autocomplete="current-password"></div><div class="field"><label>নতুন পাসওয়ার্ড</label><input name="newPassword" type="password" minlength="12" required autocomplete="new-password"></div><div class="field"><label>নতুন পাসওয়ার্ড আবার লিখো</label><input name="confirmPassword" type="password" minlength="12" required autocomplete="new-password"></div><button class="btn btn-primary" type="submit">পাসওয়ার্ড পরিবর্তন</button></form></div>`}
function bindPage(){const add=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};add('addFood',()=>foodModal());add('addCategory',()=>categoryModal());const fs=$('#foodSearch');if(fs)fs.oninput=e=>{state.foodSearch=e.target.value;const p=e.target.selectionStart;render();const n=$('#foodSearch');n.focus();n.setSelectionRange(p,p)};const os=$('#orderSearch');if(os)os.oninput=e=>{state.orderSearch=e.target.value;const p=e.target.selectionStart;render();const n=$('#orderSearch');n.focus();n.setSelectionRange(p,p)};document.querySelectorAll('[data-food-edit]').forEach(b=>b.onclick=()=>foodModal(foods().find(f=>String(f.FoodID)===b.dataset.foodEdit)));document.querySelectorAll('[data-food-delete]').forEach(b=>b.onclick=()=>deleteFood(b.dataset.foodDelete));document.querySelectorAll('[data-cat-edit]').forEach(b=>b.onclick=()=>categoryModal(cats().find(c=>String(c.CategoryID)===b.dataset.catEdit)));document.querySelectorAll('[data-cat-delete]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.catDelete));document.querySelectorAll('[data-order-edit]').forEach(b=>b.onclick=()=>orderModal(orders().find(o=>String(o.OrderID)===b.dataset.orderEdit)));const sf=$('#settingsForm');if(sf){sf.onsubmit=saveSettings;initDeliveryAreaEditor();}const pf=$('#passwordForm');if(pf)pf.onsubmit=changePassword}
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" id="modalClose">×</button></div>${body}</div></div>`;$('#modalClose').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function foodModal(f={}){const edit=!!f.FoodID;modal(edit?'খাবার সম্পাদনা':'নতুন খাবার যোগ',`<form id="foodForm"><input type="hidden" name="FoodID" value="${esc(f.FoodID||'')}"><input type="hidden" name="ImageFileID" value="${esc(f.ImageFileID||'')}"><div class="field"><label>খাবারের নাম *</label><input name="Name" required value="${esc(f.Name||'')}"></div><div class="field"><label>ক্যাটাগরি *</label><select name="CategoryID" required><option value="">ক্যাটাগরি নির্বাচন</option>${cats().map(c=>`<option value="${esc(c.CategoryID)}" ${String(c.CategoryID)===String(f.CategoryID)?'selected':''}>${esc(c.CategoryName)}</option>`).join('')}</select></div><div class="field"><label>বর্ণনা</label><textarea name="ShortDesc">${esc(f.ShortDesc||'')}</textarea></div><div class="grid2"><div class="field"><label>Regular Price *</label><input name="RegularPrice" type="number" min="0" step="0.01" required value="${esc(f.RegularPrice??'')}"></div><div class="field"><label>Discount Price</label><input name="DiscountPrice" type="number" min="0" step="0.01" value="${esc(f.DiscountPrice??'')}"></div></div><div class="field"><label>Image URL</label><input name="ImageURL" id="foodImageUrl" value="${esc(f.ImageURL||'')}" placeholder="https://..."></div><div class="field"><label>অথবা ছবি আপলোড (সর্বোচ্চ ৪ MB)</label><input type="file" id="foodImageFile" accept="image/jpeg,image/png,image/webp"><small>আপলোডের আগে ছবির Preview ও স্বয়ংক্রিয় Resize হবে।</small><div style="margin-top:8px"><img id="foodImagePreview" class="thumb" style="width:150px;height:110px;object-fit:contain" src="${esc(f.ImageURL||'')}" alt="Image preview"></div></div><div class="check-row"><label><input type="checkbox" name="IsAvailable" ${String(f.IsAvailable??true)==='true'?'checked':''}> Available</label><label><input type="checkbox" name="IsFeatured" ${String(f.IsFeatured)==='true'?'checked':''}> Featured</label><label><input type="checkbox" name="IsPopular" ${String(f.IsPopular)==='true'?'checked':''}> Popular</label></div><div class="check-row"><label><input type="checkbox" name="cleanupOldImage"> নতুন ছবি দিলে পুরোনো Drive ছবি মুছবে</label></div><div class="modal-actions"><button type="button" class="btn btn-light" id="cancelModal">বাতিল</button><button class="btn btn-primary" type="submit">সংরক্ষণ</button></div></form>`);$('#cancelModal').onclick=closeModal;const fi=$('#foodImageFile');if(fi)fi.onchange=()=>{const file=fi.files[0];if(!file)return;const u=URL.createObjectURL(file);$('#foodImagePreview').src=u};$('#foodForm').onsubmit=saveFood}
async function saveFood(e){e.preventDefault();const form=e.target,fd=new FormData(form),btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='সংরক্ষণ হচ্ছে...';try{let imageUrl=fd.get('ImageURL')||'',fileId=fd.get('ImageFileID')||'';const file=$('#foodImageFile').files[0];if(file){if(file.size>4*1024*1024)throw new Error('ছবির সাইজ ৪ MB-এর বেশি হতে পারবে না।');const base64=await new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(blob=>{if(!blob)return rej(new Error('ছবি Resize করা যায়নি।'));const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('ছবি পড়া যায়নি।'));r.readAsDataURL(blob)},'image/jpeg',0.84)};img.onerror=()=>rej(new Error('ছবি খোলা যায়নি।'));img.src=url});const up=await post('uploadImageToDrive',{payload:{base64Data:base64,mimeType:'image/jpeg',fileName:file.name.replace(/\.[^.]+$/,'')+'.jpg'}});imageUrl=up.imageUrl;fileId=up.fileId}const payload={FoodID:fd.get('FoodID')||undefined,Name:fd.get('Name').trim(),CategoryID:fd.get('CategoryID'),ShortDesc:fd.get('ShortDesc'),RegularPrice:Number(fd.get('RegularPrice')),DiscountPrice:fd.get('DiscountPrice')===''?'':Number(fd.get('DiscountPrice')),ImageURL:imageUrl,ImageFileID:fileId,IsAvailable:form.elements.IsAvailable.checked,IsFeatured:form.elements.IsFeatured.checked,IsPopular:form.elements.IsPopular.checked,cleanupOldImage:form.elements.cleanupOldImage.checked};await post('saveFoodItem',{payload});closeModal();toast('খাবার সংরক্ষণ হয়েছে।');await loadData()}catch(err){toast(err.message);btn.disabled=false;btn.textContent='সংরক্ষণ'}}
function categoryModal(c={}){modal(c.CategoryID?'ক্যাটাগরি সম্পাদনা':'নতুন ক্যাটাগরি',`<form id="categoryForm"><input type="hidden" name="CategoryID" value="${esc(c.CategoryID||'')}"><div class="field"><label>ক্যাটাগরির নাম *</label><input name="CategoryName" required value="${esc(c.CategoryName||'')}"></div><div class="field"><label>ছবির URL</label><input name="ImageURL" value="${esc(c.ImageURL||'')}"></div><div class="field"><label>Sort Order</label><input name="SortOrder" type="number" value="${esc(c.SortOrder??cats().length+1)}"></div><div class="check-row"><label><input type="checkbox" name="IsActive" ${String(c.IsActive??true)==='true'?'checked':''}> Active</label></div><div class="modal-actions"><button type="button" class="btn btn-light" id="cancelModal">বাতিল</button><button class="btn btn-primary">সংরক্ষণ</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#categoryForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const payload={CategoryID:f.elements.CategoryID.value||undefined,CategoryName:f.elements.CategoryName.value.trim(),ImageURL:f.elements.ImageURL.value.trim(),SortOrder:Number(f.elements.SortOrder.value)||0,IsActive:f.elements.IsActive.checked};try{await post('saveCategoryItem',{payload});closeModal();toast('ক্যাটাগরি সংরক্ষণ হয়েছে।');await loadData()}catch(err){toast(err.message)}}}
async function deleteFood(id){if(!confirm('এই খাবারটি Delete করতে চাও?'))return;try{await post('deleteFoodItem',{foodId:id});toast('খাবার Delete হয়েছে।');await loadData()}catch(e){toast(e.message)}}
async function deleteCategory(id){if(!confirm('এই ক্যাটাগরি Delete করতে চাও? সংশ্লিষ্ট খাবারের CategoryID প্রভাবিত হতে পারে।'))return;try{await post('deleteCategoryItem',{categoryId:id});toast('ক্যাটাগরি Delete হয়েছে।');await loadData()}catch(e){toast(e.message)}}
function orderModal(o){modal('অর্ডার স্ট্যাটাস আপডেট',`<div class="notice">Order: <b>${esc(o.OrderID)}</b> · Customer: ${esc(o.CustomerName)}</div><form id="orderForm"><div class="field"><label>Order Status</label><select name="orderStatus" required>${['Pending','Confirmed','Preparing','Ready for Delivery','Out for Delivery','Delivered','Cancelled'].map(v=>`<option value="${v}" ${String(o.OrderStatus||'Pending')===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Payment Status</label><input name="paymentStatus" required value="${esc(o.PaymentStatus||'')}" placeholder="যেমন: Paid, Unpaid (COD)"></div><div class="modal-actions"><button type="button" class="btn btn-light" id="cancelModal">বাতিল</button><button class="btn btn-primary">আপডেট</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#orderForm').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await post('updateOrderState',{payload:{orderId:o.OrderID,orderStatus:f.elements.orderStatus.value.trim(),paymentStatus:f.elements.paymentStatus.value.trim()}});closeModal();toast('অর্ডার আপডেট হয়েছে।');await loadData()}catch(err){toast(err.message)}}}

function readDeliveryAreas(){try{const a=JSON.parse($('#deliveryAreasJson')?.value||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function drawDeliveryAreas(){const root=$('#deliveryAreaEditor');if(!root)return;const a=readDeliveryAreas();root.innerHTML=a.map((x,i)=>`<div class="setting-row" style="display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center"><input data-area-name="${i}" value="${esc(x.name||'')}" placeholder="এলাকার নাম"><input data-area-charge="${i}" type="number" min="0" value="${Number(x.charge)||0}" placeholder="চার্জ"><label style="font-size:12px"><input data-area-active="${i}" type="checkbox" ${x.active!==false?'checked':''}> চালু</label><button type="button" class="btn btn-danger" data-area-remove="${i}">মুছুন</button></div>`).join('')||'<p>এখনো কোনো এলাকা যোগ করা হয়নি।</p>';root.querySelectorAll('[data-area-name],[data-area-charge],[data-area-active]').forEach(el=>el.onchange=syncDeliveryAreas);root.querySelectorAll('[data-area-remove]').forEach(b=>b.onclick=()=>{const a=readDeliveryAreas();a.splice(Number(b.dataset.areaRemove),1);$('#deliveryAreasJson').value=JSON.stringify(a);drawDeliveryAreas()})}
function syncDeliveryAreas(){const root=$('#deliveryAreaEditor');if(!root)return;const a=readDeliveryAreas();root.querySelectorAll('[data-area-name]').forEach(el=>{const i=Number(el.dataset.areaName);if(a[i])a[i].name=el.value.trim()});root.querySelectorAll('[data-area-charge]').forEach(el=>{const i=Number(el.dataset.areaCharge);if(a[i])a[i].charge=Math.max(0,Number(el.value)||0)});root.querySelectorAll('[data-area-active]').forEach(el=>{const i=Number(el.dataset.areaActive);if(a[i])a[i].active=el.checked});$('#deliveryAreasJson').value=JSON.stringify(a)}
function initDeliveryAreaEditor(){const raw=state.data?.settings?.delivery_areas_json||'[]';let a=[];try{a=JSON.parse(raw)}catch(e){}if(!Array.isArray(a)||!a.length)a=[{id:'mithapukur',name:'মিঠাপুকুর',charge:20,active:true},{id:'jagir',name:'জায়গীর',charge:20,active:true},{id:'shatibari',name:'শঠিবাড়ি',charge:20,active:true},{id:'paglarhat',name:'পাগলারহাট',charge:20,active:true}];$('#deliveryAreasJson').value=JSON.stringify(a);drawDeliveryAreas();const b=$('#addDeliveryArea');if(b)b.onclick=()=>{syncDeliveryAreas();const a=readDeliveryAreas();a.push({id:'area-'+Date.now(),name:'',charge:20,active:true});$('#deliveryAreasJson').value=JSON.stringify(a);drawDeliveryAreas()}}

async function saveSettings(e){e.preventDefault();syncDeliveryAreas();const payload={};new FormData(e.target).forEach((v,k)=>payload[k]=String(v).trim());payload.delivery_areas_json=$('#deliveryAreasJson').value;if(payload.delivery_areas_json){try{const a=JSON.parse(payload.delivery_areas_json);if(!Array.isArray(a))throw Error();const ids=new Set();for(const x of a){if(!x.id||!x.name||ids.has(String(x.id)))throw Error();ids.add(String(x.id));if(!Number.isFinite(Number(x.charge))||Number(x.charge)<0)throw Error();} }catch(_){toast('ডেলিভারি এলাকার JSON ভুল। id, name, charge এবং active ঠিক করে লিখো।');return;}}try{await post('updateStoreSettings',{payload});toast('সেটিংস সংরক্ষণ হয়েছে।');await loadData()}catch(err){toast(err.message)}}
async function changePassword(e){e.preventDefault();const f=e.target;if(f.elements.newPassword.value!==f.elements.confirmPassword.value){toast('নতুন পাসওয়ার্ড দুটি মিলছে না।');return}if(f.elements.newPassword.value.length<12){toast('নতুন পাসওয়ার্ড কমপক্ষে ১২ অক্ষরের হতে হবে।');return}try{await post('changeAdminPassword',{currentPassword:f.elements.currentPassword.value,newPassword:f.elements.newPassword.value});f.reset();toast('পাসওয়ার্ড পরিবর্তন হয়েছে। নিরাপদে রাখো।')}catch(err){toast(err.message)}}
if(state.token){showApp();loadData()}else showLogin();
})();
</script>
</body></html>
