<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOGHONNO FOOD — Admin</title>
<link rel="icon" href="/favicon.ico"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f7f7f7;font-family:'Hind Siliguri',sans-serif}header{background:#ffd400;color:#111;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.panel,.order{background:#1d1d1d;border:1px solid #383838;border-radius:14px;padding:16px;margin-bottom:14px}input,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #555}input,select{background:#292929;color:white;width:100%;margin:5px 0 12px}button{background:#ffd400;color:#111;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.muted{color:#bbb}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.status{color:#ffdc44;margin:8px 0}.order h3{margin:0}.order p{margin:5px 0}.order select{width:auto;min-width:160px}.hidden{display:none}
</style></head><body><header><h1>JOGHONNO FOOD | Admin</h1><button id="logout" class="hidden" onclick="doLogout()">লগআউট</button></header><main class="wrap">
<section id="login" class="panel" style="max-width:420px;margin:40px auto"><h2>অ্যাডমিন লগইন</h2><label>Username</label><input id="username" autocomplete="username" value="joghonno_admin"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="doLogin()">লগইন</button><div id="loginMsg" class="status"></div></section>
<section id="dashboard" class="hidden"><div class="row"><div><h2>অর্ডার ম্যানেজমেন্ট</h2><p class="muted">সর্বশেষ অর্ডার আগে দেখানো হবে</p></div><button onclick="loadOrders()">রিফ্রেশ</button></div><div id="orders"></div></section>
</main><script>
const API="/api";let token="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"৳"+Number(n||0).toLocaleString("en-US");
async function req(path,opt={}){const r=await fetch(API+path,{cache:"no-store",...opt});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||"অনুরোধটি সম্পন্ন হয়নি");return j}
async function doLogin(){const btn=document.querySelector('#login button');btn.disabled=true;const user=document.getElementById('username').value.trim(),pass=document.getElementById('password').value;try{let j=await req('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});token=j.token;document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');logoutButton();await loadOrders()}catch(e){document.getElementById('loginMsg').textContent=e.message}finally{btn.disabled=false}}
function doLogout(){token="";document.getElementById('dashboard').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('logout').classList.add('hidden')}
function logoutButton(){document.getElementById('logout').classList.remove('hidden')}
async function loadOrders(){document.getElementById('orders').innerHTML='<p class="muted">লোড হচ্ছে...</p>';try{let j=await req('/admin/orders',{headers:{Authorization:'Bearer '+token}});document.getElementById('orders').innerHTML=j.orders.length?j.orders.map(o=>{let items=j.items.filter(x=>x.order_id===o.id);return `<article class="order"><div class="row"><h3>${esc(o.order_code)} — ${money(o.total)}</h3><b>${esc(o.customer_name)}</b></div><p>📞 ${esc(o.mobile)} | 📍 ${esc(o.address)} (${esc(o.area_name||'')})</p><p>খাবার: ${items.map(x=>esc(x.food_name)+' × '+x.quantity).join(', ')||'—'}</p><p>পেমেন্ট: ${esc(o.payment_method)} | ${esc(o.payment_status)} ${o.sender_number?'| Sender: '+esc(o.sender_number):''} ${o.transaction_id?'| TrxID: '+esc(o.transaction_id):''}</p><p>নোট: ${esc(o.note||'—')}</p><div class="grid"><label>অর্ডার স্ট্যাটাস<select id="s-${o.id}">${['Pending','Confirmed','Preparing','Ready','Out for Delivery','Delivered','Cancelled'].map(v=>`<option ${o.order_status===v?'selected':''}>${v}</option>`).join('')}</select></label><label>পেমেন্ট স্ট্যাটাস<select id="p-${o.id}">${['Unpaid (COD)','Verification Pending','Paid','Rejected','Refunded'].map(v=>`<option ${o.payment_status===v?'selected':''}>${v}</option>`).join('')}</select></label></div><button onclick="saveOrder('${esc(o.order_code)}',${o.id})">আপডেট সংরক্ষণ</button></article>`}).join(''):'<p class="muted">এখনো কোনো অর্ডার নেই।</p>'}catch(e){document.getElementById('orders').innerHTML='<p class="status">'+esc(e.message)+'</p>'}}
async function saveOrder(code,id){try{await req('/admin/update',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({orderCode:code,orderStatus:document.getElementById('s-'+id).value,paymentStatus:document.getElementById('p-'+id).value})});alert('আপডেট সংরক্ষণ হয়েছে');await loadOrders()}catch(e){alert(e.message)}}
</script></body></html>
